<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Philosophy Study Dashboard</title>
  <style>
    :root {
      --bg: #0f1115;
      --bg2: #151820;
      --card: #181b22;
      --card2: #20242d;
      --text: #f2f2f2;
      --muted: #a7adb8;
      --accent: #8ee6b7;
      --accent2: #b7a6ff;
      --line: #303540;
      --danger: #ffb4a2;
      --gold: #f2d08a;
      --shadow: rgba(0,0,0,.26);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", sans-serif;
      background:
        radial-gradient(circle at 18% 0%, rgba(142,230,183,.12), transparent 30%),
        radial-gradient(circle at 86% 8%, rgba(183,166,255,.10), transparent 32%),
        linear-gradient(180deg, var(--bg), var(--bg2));
      color: var(--text);
      line-height: 1.6;
      padding: 18px;
    }

    .wrap {
      max-width: 1080px;
      margin: 0 auto;
    }

    header, .card {
      background: rgba(24, 27, 34, .92);
      border: 1px solid var(--line);
      box-shadow: 0 16px 40px var(--shadow);
      backdrop-filter: blur(10px);
    }

    header {
      padding: 24px 20px;
      border-radius: 24px;
      margin-bottom: 18px;
    }

    h1, h2, h3, p { margin-top: 0; }

    h1 {
      margin-bottom: 8px;
      font-size: clamp(28px, 5vw, 42px);
      letter-spacing: -.04em;
      line-height: 1.12;
    }

    h2 {
      font-size: 20px;
      margin-bottom: 14px;
    }

    h3 {
      margin-bottom: 8px;
      font-size: 16px;
      color: var(--accent);
    }

    p { margin-bottom: 8px; }

    .muted { color: var(--muted); }
    .small { font-size: 13px; }
    .warn { color: var(--danger); }
    .gold { color: var(--gold); }

    .topline {
      display: flex;
      gap: 12px;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .datebox {
      color: var(--muted);
      border: 1px solid var(--line);
      background: rgba(32, 36, 45, .75);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 13px;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }

    .grid.wide-left {
      grid-template-columns: minmax(0, 1.1fr) minmax(280px, .9fr);
    }

    @media (max-width: 760px) {
      .grid.wide-left { grid-template-columns: 1fr; }
      body { padding: 12px; }
      header, .card { border-radius: 20px; }
    }

    .card {
      border-radius: 20px;
      padding: 18px;
    }

    .progress {
      height: 12px;
      background: #2a2f3a;
      border-radius: 999px;
      overflow: hidden;
      margin: 12px 0 6px;
    }

    .bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width .2s ease;
    }

    .task {
      display: flex;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(32,36,45,.85);
      margin: 10px 0;
      cursor: pointer;
      user-select: none;
      transition: border-color .16s ease, transform .16s ease;
    }

    .task:hover {
      border-color: rgba(142,230,183,.65);
      transform: translateY(-1px);
    }

    .task input {
      width: 18px;
      height: 18px;
      margin-top: 4px;
      accent-color: var(--accent);
      flex: 0 0 auto;
    }

    .task.done span {
      text-decoration: line-through;
      color: var(--muted);
    }

    .concept, .question, .history-item {
      padding: 13px;
      border-radius: 16px;
      background: rgba(32,36,45,.85);
      border: 1px solid var(--line);
      margin: 10px 0;
    }

    .question strong {
      color: var(--accent);
      display: block;
      margin-bottom: 4px;
    }

    textarea, input[type="text"], select {
      width: 100%;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: #101219;
      color: var(--text);
      padding: 12px;
      font: inherit;
      outline: none;
    }

    textarea {
      min-height: 160px;
      resize: vertical;
    }

    textarea:focus, input[type="text"]:focus, select:focus {
      border-color: rgba(142,230,183,.7);
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 10px 14px;
      background: var(--accent);
      color: #07130d;
      font-weight: 800;
      cursor: pointer;
      margin: 6px 6px 0 0;
      transition: transform .15s ease, opacity .15s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button.secondary {
      background: #2b303a;
      color: var(--text);
      border: 1px solid var(--line);
    }

    button.ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
    }

    button.danger {
      background: #3a2625;
      color: var(--danger);
      border: 1px solid rgba(255,180,162,.25);
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-top: 10px;
    }

    .pillrow {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .pill {
      border: 1px solid var(--line);
      background: rgba(32,36,45,.72);
      color: var(--muted);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 13px;
    }

    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    @media (max-width: 680px) {
      .split { grid-template-columns: 1fr; }
    }

    .hidden {
      display: none !important;
    }

    .history-list {
      max-height: 280px;
      overflow: auto;
      padding-right: 4px;
    }

    .history-item {
      cursor: pointer;
    }

    .history-item:hover {
      border-color: rgba(183,166,255,.55);
    }

    .kbd {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      color: var(--gold);
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin: 24px 0 8px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <div class="topline">
        <div>
          <h1>哲学学习仪表盘</h1>
          <p class="muted">每天 1 小时 · 概念精度训练</p>
        </div>
        <div id="todayLabel" class="datebox"></div>
      </div>

      <div class="progress"><div id="bar" class="bar"></div></div>
      <p id="progressText" class="small muted">今日完成度：0%</p>

    </header>

    <section class="grid">
      <div class="card">
        <h2>今日两题</h2>
        <div class="question">
          <strong>① 经典哲学题</strong>
          <p id="classicQuestion"></p>
        </div>
        <div class="question">
          <strong>② 当代理论题</strong>
          <p id="modernQuestion"></p>
        </div>

        <div class="buttons">
          <button onclick="rerollToday()">换一组题</button>
          <button class="secondary" onclick="copyPrompt()">复制纠错 Prompt</button>
          <button class="ghost" onclick="toggleExplanation()">生成逻辑说明</button>
        </div>

        <p id="copyStatus" class="small muted"></p>

        <div id="explanationBox" class="concept hidden">
          <h3>今天答题时盯住这三件事</h3>
          <p id="explanationText"></p>
        </div>
      </div>

      <div class="card">
        <h2>答题记录</h2>
        <textarea id="answer" placeholder="在这里写今天的答案。写完后点击保存，今日打卡会自动完成。"></textarea>
        <div class="buttons">
          <button onclick="saveToday()">保存并完成打卡</button>
          <button class="danger" onclick="clearToday()">清空今日</button>
        </div>
        <p id="saveStatus" class="small muted"></p>
      </div>
    </section>

    <section class="grid">
      <div class="card">
        <h2>今日概念卡片</h2>
        <div id="conceptCards"></div>
      </div>

      <div class="card">
        <h2>标准答案对照区</h2>
        <textarea id="reference" placeholder="把 ChatGPT 纠错后的标准答案粘贴到这里，方便之后复习。"></textarea>
        <div class="buttons">
          <button onclick="saveToday()">保存标准答案</button>
          <button class="secondary" onclick="copyComparePrompt()">复制二次复盘 Prompt</button>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>概念训练模板</h2>
      <p>每个概念都按这四句写：</p>
      <p>1. 它是什么意思？</p>
      <p>2. 它在反对谁？</p>
      <p>3. 它解决什么问题？</p>
      <p>4. 它推出什么理论后果？</p>
      <p class="small warn">规则：少写漂亮废话，多写精确定义。</p>
    </section>

    <section class="grid">
      <div class="card">
        <h2>打卡历史</h2>
        <div id="historyList" class="history-list"></div>
      </div>

      <div class="card">
        <h2>备份与迁移</h2>
        <p class="muted">换电脑或换浏览器前，可以导出数据。导入时会覆盖当前浏览器里的学习记录。</p>
        <div class="buttons">
          <button onclick="exportData()">导出 JSON</button>
          <button class="secondary" onclick="document.getElementById('importFile').click()">导入 JSON</button>
          <input id="importFile" type="file" accept="application/json" class="hidden" onchange="importData(event)" />
        </div>
      </div>
    </section>

    <footer>Philosophy Study Dashboard</footer>
  </div>

  <script>
    const state = {
      dateKey: getDateKey(),
      reroll: Number(localStorage.getItem("philosophy_reroll_" + getDateKey()) || 0),
      currentSet: null
    };

    const concepts = [
      {
        term: "Form",
        school: "柏拉图 / 亚里士多德",
        desc: "柏拉图处是独立理念；亚里士多德处是事物内部的本质结构。",
        neighbor: "substance",
        problem: "个别事物如何具有稳定本质"
      },
      {
        term: "Substance",
        school: "亚里士多德 / 近代形而上学",
        desc: "承载属性并保持同一性的存在者；在不同传统里含义会移动。",
        neighbor: "accident",
        problem: "变化中的同一性如何可能"
      },
      {
        term: "Phenomenon",
        school: "康德",
        desc: "经感性形式与知性范畴组织后的经验对象，不是幻觉。",
        neighbor: "noumenon",
        problem: "认识的边界在哪里"
      },
      {
        term: "Noumenon",
        school: "康德",
        desc: "物自体或仅由理智思想的对象，标示经验认识的界限。",
        neighbor: "phenomenon",
        problem: "主体能否认识对象自身"
      },
      {
        term: "Dasein",
        school: "海德格尔",
        desc: "能够追问存在意义的存在者，具有在世存在的结构。",
        neighbor: "subject",
        problem: "为什么传统主体哲学遮蔽了存在问题"
      },
      {
        term: "Subject",
        school: "笛卡尔 / 康德 / 现当代哲学",
        desc: "不是单纯自我，而是认识、行动、反思并承担责任的位置。",
        neighbor: "identity",
        problem: "经验、行动与责任由谁承担"
      },
      {
        term: "Identity",
        school: "当代理论",
        desc: "主体在社会、文化、性别、历史关系中形成的自我理解与归属结构。",
        neighbor: "subject",
        problem: "自我是否只是社会标签的集合"
      },
      {
        term: "Power",
        school: "福柯",
        desc: "不是只从上向下压迫，而是生产知识、规范和主体的关系网络。",
        neighbor: "knowledge",
        problem: "主体如何在制度与话语中被塑造"
      },
      {
        term: "Discourse",
        school: "福柯 / 后结构主义",
        desc: "组织知识、对象和可说之物的规则系统，不只是普通言语。",
        neighbor: "language",
        problem: "何种话语条件决定了真理的出现"
      },
      {
        term: "Being",
        school: "古希腊 / 海德格尔",
        desc: "不是某个具体存在者，而是存在者得以显现为存在者的意义维度。",
        neighbor: "beings",
        problem: "存在本身为什么被遗忘"
      },
      {
        term: "Will",
        school: "叔本华 / 尼采",
        desc: "可指盲目的生命冲动，也可指创造和评价价值的力量。",
        neighbor: "reason",
        problem: "理性是否真能主宰人"
      },
      {
        term: "Alienation",
        school: "黑格尔 / 马克思",
        desc: "主体的活动或本质力量变成异己力量，并反过来支配主体。",
        neighbor: "labor",
        problem: "人为何会在自己的产物中失去自身"
      },
      {
        term: "Recognition",
        school: "黑格尔",
        desc: "主体通过他者承认而获得自我确定性。",
        neighbor: "self-consciousness",
        problem: "自我意识为何不能孤立成立"
      },
      {
        term: "Difference",
        school: "德勒兹 / 后结构主义",
        desc: "差异不只是同一性的派生，而可以被视为生成和意义的积极条件。",
        neighbor: "identity",
        problem: "为什么传统哲学偏爱同一性"
      }
    ];

    const classicTemplates = [
      "为什么 {A} 与 {B} 不能被简单等同？请说明它们在哲学史中的关键差异。",
      "请解释 {A} 试图解决什么问题，并说明它与 {B} 的关系。",
      "如果把 {A} 理解成普通意义上的“{simple}”，会产生什么误解？",
      "请以 {A} 为中心，说明它在 {school} 中的理论功能。",
      "为什么 {A} 不是孤立概念，而必须放在 {B} 的对照中理解？"
    ];

    const modernTemplates = [
      "从当代理论看，{A} 是否会改变我们对主体的理解？为什么？",
      "为什么 {A} 不能只被理解为个人心理问题，而要放进社会与历史结构中？",
      "请用 {A} 分析现代主体的形成：主体是自主的，还是被建构的？",
      "如果用 {A} 修正传统主体哲学，它会保留什么，又会破坏什么？",
      "{A} 与 {B} 的关系如何帮助我们理解当代身份、权力或责任问题？"
    ];

    function getDateKey() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function hashString(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h += (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24);
      }
      return h >>> 0;
    }

    function mulberry32(seed) {
      return function() {
        let t = seed += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    function pick(arr, rng) {
      return arr[Math.floor(rng() * arr.length)];
    }

    function generateSet() {
      const seed = hashString(state.dateKey + ":" + state.reroll);
      const rng = mulberry32(seed);

      const first = pick(concepts, rng);
      let second = pick(concepts, rng);
      let guard = 0;
      while (second.term === first.term && guard < 10) {
        second = pick(concepts, rng);
        guard++;
      }

      const classicTemplate = pick(classicTemplates, rng);
      const modernTemplate = pick(modernTemplates, rng);

      const classicQuestion = fillTemplate(classicTemplate, first, second);
      const modernQuestion = fillTemplate(modernTemplate, second, first);

      const third = pick(concepts.filter(c => c.term !== first.term && c.term !== second.term), rng);

      return {
        classicQuestion,
        modernQuestion,
        concepts: [first, second, third],
        focus: [first.term, second.term, third.term],
        explanation: `先给出 ${first.term}、${second.term} 的定义，再说明二者解决的问题不同。答题时不要只写印象，要写出“概念位置”：它反对什么、承担什么功能、会推出什么后果。`
      };
    }

    function fillTemplate(template, a, b) {
      const simpleMap = {
        Form: "形式",
        Substance: "实体",
        Phenomenon: "现象",
        Noumenon: "物自体",
        Dasein: "此在",
        Subject: "自我",
        Identity: "身份",
        Power: "权力",
        Discourse: "话语",
        Being: "存在",
        Will: "意志",
        Alienation: "异化",
        Recognition: "承认",
        Difference: "差异"
      };

      return template
        .replaceAll("{A}", a.term)
        .replaceAll("{B}", b.term)
        .replaceAll("{school}", a.school)
        .replaceAll("{simple}", simpleMap[a.term] || a.term);
    }

    function storageKey(name) {
      return `philosophy_${name}_${state.dateKey}`;
    }

    function render() {
      state.currentSet = generateSet();

      document.getElementById("todayLabel").textContent = state.dateKey;
      document.getElementById("classicQuestion").textContent = state.currentSet.classicQuestion;
      document.getElementById("modernQuestion").textContent = state.currentSet.modernQuestion;
      document.getElementById("explanationText").textContent = state.currentSet.explanation;

      renderConcepts();

      document.getElementById("answer").value = localStorage.getItem(storageKey("answer")) || "";
      document.getElementById("reference").value = localStorage.getItem(storageKey("reference")) || "";
      updateProgress();
      renderHistory();
    }

    function renderConcepts() {
      const box = document.getElementById("conceptCards");
      box.innerHTML = state.currentSet.concepts.map(c => `
        <div class="concept">
          <h3>${c.term}</h3>
          <p>${c.desc}</p>
          <p class="small muted">传统位置：${c.school}</p>
          <p class="small muted">相邻概念：<span class="kbd">${c.neighbor}</span>｜核心问题：${c.problem}</p>
        </div>
      `).join("");
    }

    function updateProgress() {
      const completed = localStorage.getItem(storageKey("completed")) === "true";
      const pct = completed ? 100 : 0;
      document.getElementById("bar").style.width = pct + "%";
      document.getElementById("progressText").textContent = completed ? "今日打卡：已完成" : "今日打卡：未完成";
      saveMeta(false);
      renderHistory();
    }

    function saveToday() {
      const answerText = document.getElementById("answer").value.trim();
      localStorage.setItem(storageKey("answer"), document.getElementById("answer").value);
      localStorage.setItem(storageKey("reference"), document.getElementById("reference").value);

      if (answerText.length > 0) {
        localStorage.setItem(storageKey("completed"), "true");
        document.getElementById("saveStatus").textContent = "已保存，今日打卡完成。";
      } else {
        localStorage.setItem(storageKey("completed"), "false");
        document.getElementById("saveStatus").textContent = "已保存。答题区还没有内容，暂未完成打卡。";
      }

      updateProgress();
      saveMeta(true);
      renderHistory();
    }

    function saveMeta(showTime) {
      const answer = document.getElementById("answer") ? document.getElementById("answer").value : "";
      const reference = document.getElementById("reference") ? document.getElementById("reference").value : "";
      const completed = localStorage.getItem(storageKey("completed")) === "true";
      const pct = completed ? 100 : 0;

      const meta = JSON.parse(localStorage.getItem("philosophy_history") || "{}");
      meta[state.dateKey] = {
        date: state.dateKey,
        progress: pct,
        reroll: state.reroll,
        questions: {
          classic: state.currentSet.classicQuestion,
          modern: state.currentSet.modernQuestion
        },
        focus: state.currentSet.focus,
        hasAnswer: answer.trim().length > 0,
        hasReference: reference.trim().length > 0,
        updatedAt: showTime ? new Date().toLocaleString() : (meta[state.dateKey]?.updatedAt || "")
      };
      localStorage.setItem("philosophy_history", JSON.stringify(meta));
    }

    function clearToday() {
      if (!confirm("确定清空今天的答题和标准答案吗？")) return;
      document.getElementById("answer").value = "";
      document.getElementById("reference").value = "";
      localStorage.removeItem(storageKey("answer"));
      localStorage.removeItem(storageKey("reference"));
      localStorage.removeItem(storageKey("completed"));
      render();
      document.getElementById("saveStatus").textContent = "今日内容已清空。";
    }

    function rerollToday() {
      state.reroll += 1;
      localStorage.setItem("philosophy_reroll_" + state.dateKey, String(state.reroll));
      saveToday();
      render();
    }

    function makeCorrectionPrompt() {
      const answer = document.getElementById("answer").value.trim();
      const qs = state.currentSet;
      return `请作为严格的哲学导师，对我的答案进行概念精度、逻辑结构与哲学史关系上的纠错，并给出标准参考答案。

今日概念：${qs.focus.join(" / ")}

问题1：${qs.classicQuestion}

问题2：${qs.modernQuestion}

我的答案：
${answer || "（我还没有填写答案，请先给我答题框架，不要直接替我完成全文。）"}

请按以下结构回复：
1. 主要概念误差
2. 逻辑结构问题
3. 哲学史关系补充
4. 可直接背诵的标准答案
5. 下次答题提醒`;
    }

    function makeComparePrompt() {
      const answer = document.getElementById("answer").value.trim();
      const reference = document.getElementById("reference").value.trim();
      return `请比较我的原答案与标准答案，指出我真正薄弱的地方，并生成一份明天复习用的概念清单。

我的原答案：
${answer || "（空）"}

标准答案：
${reference || "（空）"}`;
    }

    async function writeClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return true;
      }

      const temp = document.createElement("textarea");
      temp.value = text;
      temp.style.position = "fixed";
      temp.style.left = "-9999px";
      document.body.appendChild(temp);
      temp.focus();
      temp.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(temp);
      return ok;
    }

    async function copyPrompt() {
      saveToday();
      try {
        await writeClipboard(makeCorrectionPrompt());
        document.getElementById("copyStatus").textContent = "纠错 Prompt 已复制。";
      } catch (e) {
        document.getElementById("copyStatus").textContent = "复制失败，请手动复制答题区内容。";
      }
    }

    async function copyComparePrompt() {
      saveToday();
      try {
        await writeClipboard(makeComparePrompt());
        document.getElementById("saveStatus").textContent = "二次复盘 Prompt 已复制。";
      } catch (e) {
        document.getElementById("saveStatus").textContent = "复制失败，请手动复制。";
      }
    }

    function toggleExplanation() {
      document.getElementById("explanationBox").classList.toggle("hidden");
    }

    function renderHistory() {
      const meta = JSON.parse(localStorage.getItem("philosophy_history") || "{}");
      const dates = Object.keys(meta).sort().reverse();
      const box = document.getElementById("historyList");

      if (!dates.length) {
        box.innerHTML = '<p class="muted">还没有打卡记录。保存一次后这里会出现历史。</p>';
        return;
      }

      box.innerHTML = dates.slice(0, 30).map(date => {
        const item = meta[date];
        return `
          <div class="history-item" onclick="loadHistory('${date}')">
            <h3>${date} · ${item.progress || 0}%</h3>
            <p class="small">${item.questions?.classic || ""}</p>
            <p class="small muted">${(item.focus || []).join(" / ")}</p>
          </div>
        `;
      }).join("");
    }

    function loadHistory(date) {
      alert("历史记录属于 " + date + "。为了避免误改旧记录，本页只直接编辑今天的数据。需要恢复旧答案时，请用导出 JSON 查看完整内容。");
    }

    function exportData() {
      saveToday();
      const data = {};
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && key.startsWith("philosophy_")) {
          data[key] = localStorage.getItem(key);
        }
      }

      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "philosophy-dashboard-backup-" + state.dateKey + ".json";
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (!confirm("导入会覆盖当前浏览器里的哲学学习记录，确定继续吗？")) return;
          Object.keys(data).forEach(key => {
            if (key.startsWith("philosophy_")) {
              localStorage.setItem(key, data[key]);
            }
          });
          location.reload();
        } catch (e) {
          alert("导入失败：文件不是有效 JSON。");
        }
      };
      reader.readAsText(file);
    }

    document.getElementById("answer").addEventListener("input", () => {
      localStorage.setItem(storageKey("answer"), document.getElementById("answer").value);
      saveMeta(false);
    });

    document.getElementById("reference").addEventListener("input", () => {
      localStorage.setItem(storageKey("reference"), document.getElementById("reference").value);
      saveMeta(false);
    });

    render();
  </script>
</body>
</html>
