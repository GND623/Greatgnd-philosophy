<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Philosophy Study Dashboard</title>
  <style>
    :root {
      --bg: #0f1115;
      --bg2: #151820;
      --card: #181b22;
      --card2: #20242d;
      --text: #f2f2f2;
      --muted: #a7adb8;
      --accent: #8ee6b7;
      --accent2: #b7a6ff;
      --line: #303540;
      --danger: #ffb4a2;
      --gold: #f2d08a;
      --shadow: rgba(0,0,0,.26);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", sans-serif;
      background:
        radial-gradient(circle at 18% 0%, rgba(142,230,183,.12), transparent 30%),
        radial-gradient(circle at 86% 8%, rgba(183,166,255,.10), transparent 32%),
        linear-gradient(180deg, var(--bg), var(--bg2));
      color: var(--text);
      line-height: 1.6;
      padding: 18px;
    }

    .wrap {
      max-width: 1080px;
      margin: 0 auto;
    }

    header, .card {
      background: rgba(24, 27, 34, .92);
      border: 1px solid var(--line);
      box-shadow: 0 16px 40px var(--shadow);
      backdrop-filter: blur(10px);
    }

    header {
      padding: 24px 20px;
      border-radius: 24px;
      margin-bottom: 18px;
    }

    h1, h2, h3, p { margin-top: 0; }

    h1 {
      margin-bottom: 8px;
      font-size: clamp(28px, 5vw, 42px);
      letter-spacing: -.04em;
      line-height: 1.12;
    }

    h2 {
      font-size: 20px;
      margin-bottom: 14px;
    }

    h3 {
      margin-bottom: 8px;
      font-size: 16px;
      color: var(--accent);
    }

    p { margin-bottom: 8px; }

    .muted { color: var(--muted); }
    .small { font-size: 13px; }
    .warn { color: var(--danger); }
    .gold { color: var(--gold); }

    .topline {
      display: flex;
      gap: 12px;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .datebox {
      color: var(--muted);
      border: 1px solid var(--line);
      background: rgba(32, 36, 45, .75);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 13px;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }

    .grid.wide-left {
      grid-template-columns: minmax(0, 1.1fr) minmax(280px, .9fr);
    }

    @media (max-width: 760px) {
      .grid.wide-left { grid-template-columns: 1fr; }
      body { padding: 12px; }
      header, .card { border-radius: 20px; }
    }

    .card {
      border-radius: 20px;
      padding: 18px;
    }

    .progress {
      height: 12px;
      background: #2a2f3a;
      border-radius: 999px;
      overflow: hidden;
      margin: 12px 0 6px;
    }

    .bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width .2s ease;
    }

    .task {
      display: flex;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(32,36,45,.85);
      margin: 10px 0;
      cursor: pointer;
      user-select: none;
      transition: border-color .16s ease, transform .16s ease;
    }

    .task:hover {
      border-color: rgba(142,230,183,.65);
      transform: translateY(-1px);
    }

    .task input {
      width: 18px;
      height: 18px;
      margin-top: 4px;
      accent-color: var(--accent);
      flex: 0 0 auto;
    }

    .task.done span {
      text-decoration: line-through;
      color: var(--muted);
    }

    .concept, .question, .history-item {
      padding: 13px;
      border-radius: 16px;
      background: rgba(32,36,45,.85);
      border: 1px solid var(--line);
      margin: 10px 0;
    }

    .question strong {
      color: var(--accent);
      display: block;
      margin-bottom: 4px;
    }

    textarea, input[type="text"], select {
      width: 100%;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: #101219;
      color: var(--text);
      padding: 12px;
      font: inherit;
      outline: none;
    }

    textarea {
      min-height: 160px;
      resize: vertical;
    }

    textarea:focus, input[type="text"]:focus, select:focus {
      border-color: rgba(142,230,183,.7);
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 10px 14px;
      background: var(--accent);
      color: #07130d;
      font-weight: 800;
      cursor: pointer;
      margin: 6px 6px 0 0;
      transition: transform .15s ease, opacity .15s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button.secondary {
      background: #2b303a;
      color: var(--text);
      border: 1px solid var(--line);
    }

    button.ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
    }

    button.danger {
      background: #3a2625;
      color: var(--danger);
      border: 1px solid rgba(255,180,162,.25);
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-top: 10px;
    }

    .pillrow {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .pill {
      border: 1px solid var(--line);
      background: rgba(32,36,45,.72);
      color: var(--muted);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 13px;
    }

    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    @media (max-width: 680px) {
      .split { grid-template-columns: 1fr; }
    }

    .hidden {
      display: none !important;
    }

    .history-list {
      max-height: 280px;
      overflow: auto;
      padding-right: 4px;
    }

    .history-item {
      cursor: pointer;
    }

    .history-item:hover {
      border-color: rgba(183,166,255,.55);
    }

    .kbd {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      color: var(--gold);
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin: 24px 0 8px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <div class="topline">
        <div>
          <h1>哲学学习仪表盘</h1>
          <p class="muted">每天 1 小时 · 哲学家、理论与影响训练</p>
        </div>
        <div id="todayLabel" class="datebox"></div>
      </div>

      <div class="progress"><div id="bar" class="bar"></div></div>
      <p id="progressText" class="small muted">今日完成度：0%</p>

    </header>

    <section class="grid">
      <div class="card">
        <h2>今日两题</h2>
        <div class="question">
          <strong>① 经典哲学题</strong>
          <p id="classicQuestion"></p>
        </div>
        <div class="question">
          <strong>② 当代理论题</strong>
          <p id="modernQuestion"></p>
        </div>

        <div class="buttons">
          <button onclick="rerollToday()">换一组题</button>
          <button class="secondary" onclick="copyPrompt()">复制纠错 Prompt</button>
          <button class="ghost" onclick="toggleExplanation()">生成逻辑说明</button>
        </div>

        <p id="copyStatus" class="small muted"></p>

        <div id="explanationBox" class="concept hidden">
          <h3>今天答题时按这个顺序写</h3>
          <p id="explanationText"></p>
        </div>
      </div>

      <div class="card">
        <h2>答题记录</h2>
        <textarea id="answer" placeholder="在这里写今天的答案。写完后点击保存，今日打卡会自动完成。"></textarea>
        <div class="buttons">
          <button onclick="saveToday()">保存并完成打卡</button>
          <button class="danger" onclick="clearToday()">清空今日</button>
        </div>
        <p id="saveStatus" class="small muted"></p>
      </div>
    </section>

    <section class="grid">
      <div class="card">
        <h2>今日概念卡片</h2>
        <div id="conceptCards"></div>
      </div>

      <div class="card">
        <h2>标准答案对照区</h2>
        <textarea id="reference" placeholder="把 ChatGPT 纠错后的标准答案粘贴到这里，方便之后复习。"></textarea>
        <div class="buttons">
          <button onclick="saveToday()">保存标准答案</button>
          <button class="secondary" onclick="copyComparePrompt()">复制二次复盘 Prompt</button>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>概念训练模板</h2>
      <p>每个概念都按这四句写：</p>
      <p>1. 它是什么意思？</p>
      <p>2. 它在反对谁？</p>
      <p>3. 它解决什么问题？</p>
      <p>4. 它推出什么理论后果？</p>
      <p class="small warn">规则：少写漂亮废话，多写精确定义。</p>
    </section>

    <section class="grid">
      <div class="card">
        <h2>打卡历史</h2>
        <div id="historyList" class="history-list"></div>
      </div>

      <div class="card">
        <h2>备份与迁移</h2>
        <p class="muted">换电脑或换浏览器前，可以导出数据。导入时会覆盖当前浏览器里的学习记录。</p>
        <div class="buttons">
          <button onclick="exportData()">导出 JSON</button>
          <button class="secondary" onclick="document.getElementById('importFile').click()">导入 JSON</button>
          <input id="importFile" type="file" accept="application/json" class="hidden" onchange="importData(event)" />
        </div>
      </div>
    </section>

    <footer>Philosophy Study Dashboard</footer>
  </div>

  <script>
    const state = {
      dateKey: getDateKey(),
      reroll: Number(localStorage.getItem("philosophy_reroll_" + getDateKey()) || 0),
      currentSet: null
    };

    const thinkers = [
      {
        name: "柏拉图",
        theory: "理念论",
        summary: "真实存在不是感官世界中的个别事物，而是超越经验、稳定不变的理念。",
        against: "智者派的相对主义，以及只停留在感官经验中的认识方式",
        influence: "奠定了西方形而上学中“超感性真实”的传统，也影响了基督教神学和后来的唯理论。"
      },
      {
        name: "亚里士多德",
        theory: "实体论与形式质料论",
        summary: "形式不在事物之外，而在具体事物之中；事物由质料与形式共同构成。",
        against: "柏拉图把理念与个别事物分离的倾向",
        influence: "为中世纪经院哲学、目的论自然观和传统形而上学提供了基本框架。"
      },
      {
        name: "笛卡尔",
        theory: "我思与近代主体哲学",
        summary: "通过普遍怀疑寻找不可怀疑的确定性，最终确立“我思”作为知识基础。",
        against: "未经反思的传统权威和感官经验的不可靠性",
        influence: "开启近代认识论转向，使主体成为知识确定性的核心。"
      },
      {
        name: "斯宾诺莎",
        theory: "实体一元论",
        summary: "只有一个无限实体，即神或自然；心灵与身体只是同一实体的不同属性。",
        against: "笛卡尔的心物二元论",
        influence: "影响德国古典哲学、浪漫主义和后来的泛神论、自然主义传统。"
      },
      {
        name: "洛克",
        theory: "经验论与白板说",
        summary: "人的观念来自经验，心灵最初并没有天赋观念。",
        against: "笛卡尔式天赋观念论",
        influence: "推动英国经验论发展，并影响自由主义政治哲学。"
      },
      {
        name: "休谟",
        theory: "经验论怀疑主义",
        summary: "因果性、自我和必然联系都不能由经验直接证明，只是习惯性联想的结果。",
        against: "理性能够证明形而上学必然性的信念",
        influence: "促使康德从“独断论迷梦”中醒来，推动批判哲学诞生。"
      },
      {
        name: "康德",
        theory: "先验哲学",
        summary: "经验知识之所以可能，是因为主体以先天形式和范畴组织经验材料。",
        against: "经验论与唯理论各自的片面性",
        influence: "完成认识论中的“哥白尼式革命”，深刻影响德国古典哲学和现代主体理论。"
      },
      {
        name: "黑格尔",
        theory: "辩证法与精神哲学",
        summary: "真理不是静止命题，而是在矛盾、否定和扬弃中展开的历史过程。",
        against: "康德那里不可认识的物自体，以及抽象固定的知性思维",
        influence: "影响马克思主义、存在主义、承认理论和现代历史哲学。"
      },
      {
        name: "马克思",
        theory: "历史唯物主义与异化劳动",
        summary: "社会存在决定意识；资本主义劳动中，人的活动及其产物反过来支配人。",
        against: "黑格尔的唯心主义历史观和抽象的人本主义",
        influence: "改变了现代政治哲学、社会理论和意识形态批判。"
      },
      {
        name: "尼采",
        theory: "上帝之死与价值重估",
        summary: "传统最高价值失去权威后，人必须重新创造价值，而不是依赖既定道德。",
        against: "基督教道德、柏拉图主义和把生命压低的虚无主义价值体系",
        influence: "影响存在主义、后结构主义、现代文学与文化批判。"
      },
      {
        name: "胡塞尔",
        theory: "现象学还原",
        summary: "悬置自然态度，回到意识如何显现对象的结构本身。",
        against: "心理主义和未经反思的自然主义认识论",
        influence: "开启现象学运动，影响海德格尔、萨特、梅洛-庞蒂等人。"
      },
      {
        name: "海德格尔",
        theory: "存在论与此在分析",
        summary: "哲学的根本问题不是认识对象，而是追问存在的意义；此在是能追问存在的存在者。",
        against: "近代主体哲学和传统形而上学对存在问题的遗忘",
        influence: "影响存在主义、解释学、解构主义和现代神学。"
      },
      {
        name: "萨特",
        theory: "存在先于本质",
        summary: "人没有预设本质，而是在选择和行动中塑造自身，并必须承担自由的责任。",
        against: "本质主义的人性观和逃避自由的自欺",
        influence: "成为存在主义伦理和现代自由理论的重要代表。"
      },
      {
        name: "福柯",
        theory: "权力—知识与主体化",
        summary: "权力不仅压迫人，也通过知识、制度和话语生产主体。",
        against: "把主体看成完全自主、先于社会结构存在的近代主体观",
        influence: "影响后结构主义、性别理论、医学史、监狱研究和现代治理批判。"
      }
    ];

    const pairTopics = [
      {
        a: "柏拉图",
        b: "亚里士多德",
        focus: "理念论与形式论",
        question: "柏拉图的理念论与亚里士多德的形式论有什么根本区别？为什么说亚里士多德把“形式”重新放回了具体事物之中？",
        hint: "先说明柏拉图的理念在个别事物之外，再说明亚里士多德的形式在事物之内，最后指出这改变了形而上学的方向。"
      },
      {
        a: "笛卡尔",
        b: "洛克",
        focus: "唯理论与经验论",
        question: "笛卡尔的天赋观念思想与洛克的经验论有什么区别？二者对“知识从哪里来”的回答有何不同？",
        hint: "抓住一个关键词：笛卡尔重视理性确定性，洛克重视经验来源。"
      },
      {
        a: "笛卡尔",
        b: "斯宾诺莎",
        focus: "心物二元论与实体一元论",
        question: "斯宾诺莎为什么反对笛卡尔的心物二元论？他的实体一元论如何重新理解心灵与身体的关系？",
        hint: "先写笛卡尔区分心灵和身体，再写斯宾诺莎认为二者是同一实体的不同属性。"
      },
      {
        a: "休谟",
        b: "康德",
        focus: "怀疑主义与先验哲学",
        question: "休谟的因果怀疑如何推动康德提出先验哲学？康德怎样回应“因果性来自习惯”这一问题？",
        hint: "重点写：休谟质疑因果必然性，康德把因果性理解为主体先天范畴。"
      },
      {
        a: "康德",
        b: "黑格尔",
        focus: "批判哲学与辩证法",
        question: "黑格尔为什么不满足于康德的物自体？他的辩证法如何试图克服康德哲学中的限制？",
        hint: "抓住物自体、界限、辩证展开三个词。"
      },
      {
        a: "黑格尔",
        b: "马克思",
        focus: "唯心辩证法与历史唯物主义",
        question: "马克思如何改造黑格尔的辩证法？为什么说马克思把辩证法从精神的发展转向现实社会关系？",
        hint: "先写黑格尔重精神和理念展开，再写马克思重物质生产、劳动和社会关系。"
      },
      {
        a: "尼采",
        b: "柏拉图",
        focus: "价值重估与反柏拉图主义",
        question: "为什么尼采常被理解为反柏拉图主义者？他反对柏拉图传统中的哪些价值倾向？",
        hint: "重点写尼采反对贬低感性世界、生命和身体的超越价值。"
      },
      {
        a: "胡塞尔",
        b: "海德格尔",
        focus: "现象学与存在论",
        question: "海德格尔如何继承又改变胡塞尔的现象学？为什么他的重点从意识结构转向了存在问题？",
        hint: "先写胡塞尔关注意识如何显现对象，再写海德格尔关注此在与存在意义。"
      },
      {
        a: "海德格尔",
        b: "萨特",
        focus: "存在论与存在主义",
        question: "萨特的“存在先于本质”与海德格尔的此在分析有什么联系和差异？",
        hint: "可以写二者都反对抽象本质主义，但萨特更强调自由选择和责任。"
      },
      {
        a: "康德",
        b: "福柯",
        focus: "主体条件与主体化",
        question: "康德和福柯都关心主体，但他们理解主体的方式有什么不同？",
        hint: "康德问主体如何使经验知识成为可能；福柯问主体如何被制度、知识和权力塑造。"
      }
    ];

    const influenceTopics = [
      {
        thinker: "柏拉图",
        question: "请说明柏拉图理念论的核心内容，并简要分析它为什么会影响后来的形而上学和基督教思想。",
        hint: "按“理念是什么—它和感性事物的关系—后续影响”来写。"
      },
      {
        thinker: "亚里士多德",
        question: "请说明亚里士多德实体论的基本思路，并分析它如何修正柏拉图的理念论。",
        hint: "抓住实体、形式、质料，以及形式在事物之内。"
      },
      {
        thinker: "笛卡尔",
        question: "请说明笛卡尔“我思故我在”的理论意义。为什么它被视为近代主体哲学的开端？",
        hint: "不要只解释句子，要写它如何把知识基础转向主体。"
      },
      {
        thinker: "休谟",
        question: "请说明休谟对因果性的怀疑，并分析它为什么对康德哲学产生重要影响。",
        hint: "写清楚：经验中只有先后相继，没有必然联系。"
      },
      {
        thinker: "康德",
        question: "请说明康德“哥白尼式革命”的含义。它如何改变主体与对象的关系？",
        hint: "重点：不是认识符合对象，而是对象作为经验对象必须符合主体的认识形式。"
      },
      {
        thinker: "黑格尔",
        question: "请说明黑格尔辩证法中的“否定”和“扬弃”是什么意思，并举例说明它为何不是简单否定。",
        hint: "写出：保留、取消、提升三个层次。"
      },
      {
        thinker: "马克思",
        question: "请说明马克思异化劳动理论的基本内容，并分析它对现代社会批判的意义。",
        hint: "可从劳动产品、劳动过程、人的类本质、人与人的关系四方面写。"
      },
      {
        thinker: "尼采",
        question: "请说明尼采“上帝之死”的含义。为什么它不是单纯的宗教命题，而是价值危机命题？",
        hint: "抓住最高价值失效、虚无主义、价值重估。"
      },
      {
        thinker: "海德格尔",
        question: "请说明海德格尔为什么要区分“存在”与“存在者”。这一问题对传统形而上学有什么批判意义？",
        hint: "先解释存在者是具体对象，再解释存在是对象得以显现的意义维度。"
      },
      {
        thinker: "福柯",
        question: "请说明福柯“权力—知识”的基本含义，并分析它如何改变我们对主体的理解。",
        hint: "重点：权力不是只压迫，也会生产知识、规范和主体。"
      }
    ];

    function makeQuestionSet(rng) {
      const usePair = rng() < 0.62;
      if (usePair) {
        const topic = pick(pairTopics, rng);
        const a = thinkers.find(t => t.name === topic.a);
        const b = thinkers.find(t => t.name === topic.b);
        return {
          classicQuestion: topic.question,
          modernQuestion: `请补充说明：${topic.a}与${topic.b}这一区别，对后来的哲学问题或现代思想有什么影响？`,
          concepts: [
            {
              term: `${topic.a}：${a.theory}`,
              desc: a.summary,
              school: `反对或修正：${a.against}`,
              neighbor: topic.b,
              problem: a.influence
            },
            {
              term: `${topic.b}：${b.theory}`,
              desc: b.summary,
              school: `反对或修正：${b.against}`,
              neighbor: topic.a,
              problem: b.influence
            },
            {
              term: topic.focus,
              desc: topic.hint,
              school: "比较题写作提示",
              neighbor: "区别 / 继承 / 修正",
              problem: "先分别定义，再比较差异，最后写影响。"
            }
          ],
          focus: [topic.a, topic.b, topic.focus],
          explanation: topic.hint
        };
      }

      const topic = pick(influenceTopics, rng);
      const thinker = thinkers.find(t => t.name === topic.thinker);
      return {
        classicQuestion: topic.question,
        modernQuestion: `请进一步说明：${thinker.name}的${thinker.theory}主要反对或修正了什么思想？它对后来的哲学产生了什么影响？`,
        concepts: [
          {
            term: `${thinker.name}：${thinker.theory}`,
            desc: thinker.summary,
            school: `反对或修正：${thinker.against}`,
            neighbor: thinker.name,
            problem: thinker.influence
          },
          {
            term: "理论背景",
            desc: `这套理论主要针对：${thinker.against}。`,
            school: "哲学史位置",
            neighbor: "前人问题",
            problem: "回答时要写清楚它不是凭空出现的。"
          },
          {
            term: "后续影响",
            desc: thinker.influence,
            school: "影响线索",
            neighbor: "后世理论",
            problem: topic.hint
          }
        ],
        focus: [thinker.name, thinker.theory, "影响"],
        explanation: topic.hint
      };
    }

    function getDateKey() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function hashString(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h += (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24);
      }
      return h >>> 0;
    }

    function mulberry32(seed) {
      return function() {
        let t = seed += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    function pick(arr, rng) {
      return arr[Math.floor(rng() * arr.length)];
    }

    function generateSet() {
      const seed = hashString(state.dateKey + ":" + state.reroll);
      const rng = mulberry32(seed);
      return makeQuestionSet(rng);
    }

    function storageKey(name) {
      return `philosophy_${name}_${state.dateKey}`;
    }

    function render() {
      state.currentSet = generateSet();

      document.getElementById("todayLabel").textContent = state.dateKey;
      document.getElementById("classicQuestion").textContent = state.currentSet.classicQuestion;
      document.getElementById("modernQuestion").textContent = state.currentSet.modernQuestion;
      document.getElementById("explanationText").textContent = state.currentSet.explanation;

      renderConcepts();

      document.getElementById("answer").value = localStorage.getItem(storageKey("answer")) || "";
      document.getElementById("reference").value = localStorage.getItem(storageKey("reference")) || "";
      updateProgress();
      renderHistory();
    }

    function renderConcepts() {
      const box = document.getElementById("conceptCards");
      box.innerHTML = state.currentSet.concepts.map(c => `
        <div class="concept">
          <h3>${c.term}</h3>
          <p>${c.desc}</p>
          <p class="small muted">${c.school}</p>
          <p class="small muted">关联线索：<span class="kbd">${c.neighbor}</span><br>影响/答题提示：${c.problem}</p>
        </div>
      `).join("");
    }

    function updateProgress() {
      const completed = localStorage.getItem(storageKey("completed")) === "true";
      const pct = completed ? 100 : 0;
      document.getElementById("bar").style.width = pct + "%";
      document.getElementById("progressText").textContent = completed ? "今日打卡：已完成" : "今日打卡：未完成";
      saveMeta(false);
      renderHistory();
    }

    function saveToday() {
      const answerText = document.getElementById("answer").value.trim();
      localStorage.setItem(storageKey("answer"), document.getElementById("answer").value);
      localStorage.setItem(storageKey("reference"), document.getElementById("reference").value);

      if (answerText.length > 0) {
        localStorage.setItem(storageKey("completed"), "true");
        document.getElementById("saveStatus").textContent = "已保存，今日打卡完成。";
      } else {
        localStorage.setItem(storageKey("completed"), "false");
        document.getElementById("saveStatus").textContent = "已保存。答题区还没有内容，暂未完成打卡。";
      }

      updateProgress();
      saveMeta(true);
      renderHistory();
    }

    function saveMeta(showTime) {
      const answer = document.getElementById("answer") ? document.getElementById("answer").value : "";
      const reference = document.getElementById("reference") ? document.getElementById("reference").value : "";
      const completed = localStorage.getItem(storageKey("completed")) === "true";
      const pct = completed ? 100 : 0;

      const meta = JSON.parse(localStorage.getItem("philosophy_history") || "{}");
      meta[state.dateKey] = {
        date: state.dateKey,
        progress: pct,
        reroll: state.reroll,
        questions: {
          classic: state.currentSet.classicQuestion,
          modern: state.currentSet.modernQuestion
        },
        focus: state.currentSet.focus,
        hasAnswer: answer.trim().length > 0,
        hasReference: reference.trim().length > 0,
        updatedAt: showTime ? new Date().toLocaleString() : (meta[state.dateKey]?.updatedAt || "")
      };
      localStorage.setItem("philosophy_history", JSON.stringify(meta));
    }

    function clearToday() {
      if (!confirm("确定清空今天的答题和标准答案吗？")) return;
      document.getElementById("answer").value = "";
      document.getElementById("reference").value = "";
      localStorage.removeItem(storageKey("answer"));
      localStorage.removeItem(storageKey("reference"));
      localStorage.removeItem(storageKey("completed"));
      render();
      document.getElementById("saveStatus").textContent = "今日内容已清空。";
    }

    function rerollToday() {
      state.reroll += 1;
      localStorage.setItem("philosophy_reroll_" + state.dateKey, String(state.reroll));
      saveToday();
      render();
    }

    function makeCorrectionPrompt() {
      const answer = document.getElementById("answer").value.trim();
      const qs = state.currentSet;
      return `请作为严格的哲学导师，对我的答案进行概念精度、逻辑结构与哲学史关系上的纠错，并给出标准参考答案。

今日概念：${qs.focus.join(" / ")}

问题1：${qs.classicQuestion}

问题2：${qs.modernQuestion}

我的答案：
${answer || "（我还没有填写答案，请先给我答题框架，不要直接替我完成全文。）"}

请按以下结构回复：
1. 主要概念误差
2. 逻辑结构问题
3. 哲学史关系补充
4. 可直接背诵的标准答案
5. 下次答题提醒`;
    }

    function makeComparePrompt() {
      const answer = document.getElementById("answer").value.trim();
      const reference = document.getElementById("reference").value.trim();
      return `请比较我的原答案与标准答案，指出我真正薄弱的地方，并生成一份明天复习用的概念清单。

我的原答案：
${answer || "（空）"}

标准答案：
${reference || "（空）"}`;
    }

    async function writeClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return true;
      }

      const temp = document.createElement("textarea");
      temp.value = text;
      temp.style.position = "fixed";
      temp.style.left = "-9999px";
      document.body.appendChild(temp);
      temp.focus();
      temp.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(temp);
      return ok;
    }

    async function copyPrompt() {
      saveToday();
      try {
        await writeClipboard(makeCorrectionPrompt());
        document.getElementById("copyStatus").textContent = "纠错 Prompt 已复制。";
      } catch (e) {
        document.getElementById("copyStatus").textContent = "复制失败，请手动复制答题区内容。";
      }
    }

    async function copyComparePrompt() {
      saveToday();
      try {
        await writeClipboard(makeComparePrompt());
        document.getElementById("saveStatus").textContent = "二次复盘 Prompt 已复制。";
      } catch (e) {
        document.getElementById("saveStatus").textContent = "复制失败，请手动复制。";
      }
    }

    function toggleExplanation() {
      document.getElementById("explanationBox").classList.toggle("hidden");
    }

    function renderHistory() {
      const meta = JSON.parse(localStorage.getItem("philosophy_history") || "{}");
      const dates = Object.keys(meta).sort().reverse();
      const box = document.getElementById("historyList");

      if (!dates.length) {
        box.innerHTML = '<p class="muted">还没有打卡记录。保存一次后这里会出现历史。</p>';
        return;
      }

      box.innerHTML = dates.slice(0, 30).map(date => {
        const item = meta[date];
        return `
          <div class="history-item" onclick="loadHistory('${date}')">
            <h3>${date} · ${item.progress || 0}%</h3>
            <p class="small">${item.questions?.classic || ""}</p>
            <p class="small muted">${(item.focus || []).join(" / ")}</p>
          </div>
        `;
      }).join("");
    }

    function loadHistory(date) {
      alert("历史记录属于 " + date + "。为了避免误改旧记录，本页只直接编辑今天的数据。需要恢复旧答案时，请用导出 JSON 查看完整内容。");
    }

    function exportData() {
      saveToday();
      const data = {};
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && key.startsWith("philosophy_")) {
          data[key] = localStorage.getItem(key);
        }
      }

      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "philosophy-dashboard-backup-" + state.dateKey + ".json";
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (!confirm("导入会覆盖当前浏览器里的哲学学习记录，确定继续吗？")) return;
          Object.keys(data).forEach(key => {
            if (key.startsWith("philosophy_")) {
              localStorage.setItem(key, data[key]);
            }
          });
          location.reload();
        } catch (e) {
          alert("导入失败：文件不是有效 JSON。");
        }
      };
      reader.readAsText(file);
    }

    document.getElementById("answer").addEventListener("input", () => {
      localStorage.setItem(storageKey("answer"), document.getElementById("answer").value);
      saveMeta(false);
    });

    document.getElementById("reference").addEventListener("input", () => {
      localStorage.setItem(storageKey("reference"), document.getElementById("reference").value);
      saveMeta(false);
    });

    render();
  </script>
</body>
</html>
